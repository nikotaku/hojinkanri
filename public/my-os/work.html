<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>仕事の原則｜My OS</title><link rel="stylesheet" href="./work.css"></head><body><main class="work"><header><a href="/">‹ ホーム</a><h1>仕事の原則</h1></header><p id="notice" role="status"></p><form id="login" hidden><label>フォーカスのパスワード<input required type="password" name="password" autocomplete="current-password"></label><button>ログイン</button></form><div id="panel" hidden><nav id="tabs" aria-label="仕事の原則"></nav><div class="tools"><input id="search" type="search" aria-label="横断検索" placeholder="記録・原則・予定を検索"><button id="add" aria-label="新規登録">＋</button></div><div id="actions"></div><section id="list"></section><footer><button id="export">Markdown一括保存</button><button id="logout">ログアウト</button></footer></div><dialog id="dialog"><form id="editor"><div id="inputs"></div><div class="tools"><button type="button" id="close">閉じる</button><button id="save">確定して保存</button></div><p id="error" role="alert"></p></form></dialog></main><script type="module" src="./work-ui.js"></script></body></html>
