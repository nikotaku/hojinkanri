<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TOSHO株式会社</title>
<meta name="description" content="TOSHO株式会社の会社案内。北海道札幌市中央区。" />
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #ffffff;
    --accent: #1d4ed8;
    --soft: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e5e7eb; --muted: #9ca3af; --line: #253040;
      --bg: #0b1220; --accent: #7aa2ff; --soft: #111a2b;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e5e7eb; --muted: #9ca3af; --line: #253040;
    --bg: #0b1220; --accent: #7aa2ff; --soft: #111a2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: .02em; }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 14px; margin-left: 20px;
  }
  nav a:hover { color: var(--accent); }
  @media (max-width: 560px) { nav a { margin-left: 14px; font-size: 13px; } }

  .hero { padding: 84px 0 72px; border-bottom: 1px solid var(--line); }
  .hero h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 44px); line-height: 1.35; letter-spacing: .01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 16px; }

  section { padding: 56px 0; border-bottom: 1px solid var(--line); }
  h2 {
    margin: 0 0 6px; font-size: 13px; font-weight: 700;
    letter-spacing: .14em; color: var(--accent); text-transform: uppercase;
  }
  .lead { margin: 0 0 24px; font-size: 22px; font-weight: 700; }

  .note {
    background: var(--soft); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; color: var(--muted); font-size: 15px;
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
  th { width: 148px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  @media (max-width: 560px) {
    th, td { display: block; border-bottom: none; padding: 2px 0; }
    th { width: auto; font-size: 13px; padding-top: 14px; }
    td { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  }
  td a { color: var(--accent); }

  .contact a.tel {
    display: inline-block; margin-top: 4px;
    font-size: 26px; font-weight: 700; color: var(--ink); text-decoration: none;
    letter-spacing: .02em;
  }
  .contact a.tel:hover { color: var(--accent); }

  footer { padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <span class="logo">TOSHO株式会社</span>
    <nav>
      <a href="#business">事業内容</a>
      <a href="#company">会社概要</a>
      <a href="#contact">お問い合わせ</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="hero">
      <h1>TOSHO株式会社</h1>
      <p>北海道札幌市中央区</p>
    </div>

    <section id="business">
      <h2>Business</h2>
      <p class="lead">事業内容</p>
      <p class="note">
        準備中です。内容が決まり次第、掲載いたします。
      </p>
    </section>

    <section id="company">
      <h2>Company</h2>
      <p class="lead">会社概要</p>
      <table>
        <tbody>
          <tr><th>商号</th><td>TOSHO株式会社</td></tr>
          <tr><th>所在地</th><td>〒064-0804<br />北海道札幌市中央区南4条西11丁目1291-12</td></tr>
          <tr><th>代表者</th><td>代表取締役　小野寺 千尋</td></tr>
          <tr><th>設立</th><td>2020年7月20日</td></tr>
          <tr><th>資本金</th><td>3,000,000円</td></tr>
          <tr><th>法人番号</th><td>7430001081972</td></tr>
          <tr><th>電話番号</th><td><a href="tel:05017250323">050-1725-0323</a></td></tr>
        </tbody>
      </table>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <p class="lead">お問い合わせ</p>
      <p style="margin:0;color:var(--muted);font-size:15px;">
        お電話にて承っております。
      </p>
      <a class="tel" href="tel:05017250323">050-1725-0323</a>
    </section>

  </div>
</main>

<footer>
  <div class="wrap">© TOSHO株式会社</div>
</footer>

</body>
</html>
